<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIC | Rapid Interception Command</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/tactical_theme.css" />
    <script>window.STATIC_URL = "/static/assets/";</script>
</head>
<body>

    <div id="header">
        <div class="sys-title">TRIC // TACTICAL ORCHESTRATOR</div>
        <div id="comms-indicator" class="comms-status offline-text">
            <span id="comms-dot" class="status-dot offline-dot"></span> UPLINK: DISCONNECTED
        </div>
    </div>

    <div id="core-layout">
        <div id="left-column">
            <div id="map-container">
                <div id="map"></div>
                <div class="map-overlay-scanline"></div>
                
                <button id="topo-trigger-btn" style="display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0, 0, 0, 0.85); border: 1px solid #00ea4f; color: #00ea4f; padding: 12px 24px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 234, 79, 0.4);">
                    [!] TACTICAL RANGE REACHED: INITIALIZE 3D TOPOGRAPHY
                </button>
            </div>
            
            <div id="video-container" class="panel">
                <div class="video-overlay-text">🔴 LIVE UAV FEED // FLIR-07</div>
                <img id="drone-feed" src="/api/video_feed" alt="AWAITING VIDEO STREAM...">
            </div>
        </div>
        
        <div id="sidebar">
            <div class="panel">
                <div class="panel-title">LIVE TELEMETRY // <span id="tel-type">AWAITING DATA</span></div>
                <div class="telemetry-grid">
                    <div><div class="data-label">STATUS</div><div id="tel-status" class="data-value" style="color: #66aa99;">STANDBY</div></div>
                    <div><div class="data-label">CONFIDENCE</div><div id="tel-conf" class="data-value">--%</div></div>
                    <div><div class="data-label">INTENSITY</div><div id="tel-int" class="data-value">--</div></div>
                    <div><div class="data-label">LATENCY</div><div id="tel-lat" class="data-value">-- ms</div></div>
                </div>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dotted #384d3c;">
                    <div class="data-label">TARGET COORDINATES</div>
                    <div id="tel-coords" class="data-value" style="font-size: 1.2rem;">NO LOCK</div>
                </div>
            </div>

            <div id="mission-feed">
                <div class="panel-title">MISSION FEED</div>
            </div>
            
            <div style="padding-top: 10px;">
                <button class="btn-primary" onclick="clearMap()" style="width: 100%;">PURGE TRACKS</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map_loader.js"></script>
</body>
</html>
